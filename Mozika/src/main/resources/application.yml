  username: kaloy123
  password: "hZ7Z8zrP:4.!9Rj"
  sender-id: KALOY

kaloy:
  uploads:
    # Dossier ou sont ecrits les fichiers envoyes, et adresse publique servant
    # a les relire. 10.0.2.2 est l'alias de l'hote vu depuis l'emulateur Android.
    dossier: ${user.dir}/uploads
    # Chemin et non adresse absolue : le nom d'hote dependrait du reseau, et
    # serait fige en base au moment de l'envoi. L'application le prefixe avec
    # sa propre adresse de base.
    url-publique: /uploads
    # Envoi par morceaux, pour les videos. Une video de 5 minutes pese 300 a
    # 500 Mo : elle ne tient ni dans la memoire du telephone, ni dans une
    # seule requete. Decoupee, chaque requete reste minuscule et la limite
    # multipart de 200 Mo n est jamais approchee.
    morceaux:
      # 2 Mo : quelques secondes par morceau sur reseau mobile, donc peu
      # perdu a chaque coupure, et 250 requetes pour 500 Mo.
      taille: 2097152
      # 2 Go. Refuse a l ouverture de la session, pas apres 40 minutes.
      taille-max-totale: 2147483648
      # Au-dela, une session abandonnee est purgee : sinon ses morceaux
      # restent sur le disque pour toujours.
      duree-vie-heures: 24



server:
  port: 8087
  servlet:
    context-path: /mozika

# Logs Configuration
